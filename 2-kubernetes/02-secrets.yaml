apiVersion: v1
kind: Secret
metadata:
  name: solidtime-secrets
  namespace: solidtime
type: Opaque
# NOTE: The values below use 'stringData' which accepts plain text values.
# Kubernetes will automatically base64 encode them when the secret is created.
# If you prefer to use 'data' instead of 'stringData', you must base64 encode
# all values manually before applying: echo -n "value" | base64
stringData:
  # Database Configuration
  DB_CONNECTION: pgsql
  DB_HOST: "your-postgres-host"
  DB_PORT: "5432"
  DB_DATABASE: "solidtime"
  DB_USERNAME: "solidtime"
  DB_PASSWORD: "your-secure-password"
  
  # Application Key (generate with: php artisan key:generate)
  APP_KEY: "base64:YOUR_APP_KEY_HERE"
  
  # Mail Configuration (optional)
  MAIL_MAILER: smtp
  MAIL_HOST: "smtp.mailtrap.io"
  MAIL_PORT: "2525"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  MAIL_ENCRYPTION: "tls"
  MAIL_FROM_ADDRESS: "hello@example.com"
  MAIL_FROM_NAME: "Solidtime"

