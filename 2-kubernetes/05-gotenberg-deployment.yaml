apiVersion: apps/v1
kind: Deployment
metadata:
  name: solidtime-gotenberg
  namespace: solidtime
  labels:
    app: solidtime
    component: gotenberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solidtime
      component: gotenberg
  template:
    metadata:
      labels:
        app: solidtime
        component: gotenberg
    spec:
      containers:
      - name: gotenberg
        image: gotenberg/gotenberg:8
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

